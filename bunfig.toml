# FluxStack Bun Configuration
[build]
target = "bun"

[install]
# Package installation settings
cache = true
lockfile = true

# Path mapping for runtime execution
[run]
preload = ["./core/plugins/built-in/renderers/ssr/ssr-preload.ts"]

# Path mapping (alias support) - matches tsconfig.json
[run.alias]
"@/*" = "./*"
"@server/*" = "./app/server/*"
"@client/*" = "./app/client/*"
"@core/*" = "./core/*"
"@config" = "./config/index.ts"
"@config/*" = "./config/*"
"@app/*" = "./app/*"
"@shared/*" = "./app/shared/*"
# Force single React instance at runtime (SSR needs this)
"react" = "./node_modules/react"
"react-dom" = "./node_modules/react-dom"
"react/jsx-runtime" = "./node_modules/react/jsx-runtime"
"react/jsx-dev-runtime" = "./node_modules/react/jsx-dev-runtime"

[build.alias]
"@/*" = "./*"
"@server/*" = "./app/server/*"
"@client/*" = "./app/client/*"
"@core/*" = "./core/*"
"@config" = "./config/index.ts"
"@config/*" = "./config/*"
"@app/*" = "./app/*"
"@shared/*" = "./app/shared/*"
# Force single React instance (avoid duplicate from fluxstack-live monorepo)
"react" = "./node_modules/react"
"react-dom" = "./node_modules/react-dom"
"react/jsx-runtime" = "./node_modules/react/jsx-runtime"
"react/jsx-dev-runtime" = "./node_modules/react/jsx-dev-runtime"

[serve.static]
plugins = ["bun-plugin-tailwind", "./core/plugins/built-in/renderers/ssr/react-dedupe-plugin.ts"]