# FluxStack Bun Configuration
[build]
target = "bun"

[install]
# Package installation settings
cache = true
lockfile = true

# Path mapping for runtime execution
[run]
preload = []

# Path mapping (alias support) - matches tsconfig.json
[run.alias]
"@/*" = "./*"
"@server/*" = "./app/server/*"
"@client/*" = "./app/client/*"
"@core/*" = "./core/*"
"@config" = "./config/index.ts"
"@config/*" = "./config/*"
"@app/*" = "./app/*"
"@shared/*" = "./app/shared/*"

[build.alias]
"@/*" = "./*"
"@server/*" = "./app/server/*"
"@client/*" = "./app/client/*"
"@core/*" = "./core/*"
"@config" = "./config/index.ts"
"@config/*" = "./config/*"
"@app/*" = "./app/*"
"@shared/*" = "./app/shared/*"